# Config for the persistent shells behind nvim's floating terminal (see
# lua/plugins/floaterm.lua). These run on their own tmux server
# (-L floaterm), which is what lets them outlive nvim, and keeps them
# from showing up in the outer session's window list.

# The outer tmux uses the default C-b, so the inner one has to differ --
# otherwise every prefix key inside the float is ambiguous.
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# floaterm draws its own bar and sidebar; a second status line inside the
# float is just noise.
set -g status off

# With mouse reporting on, nvim forwards the wheel straight through to
# tmux (:h terminal-mouse) instead of dropping out of terminal mode, so
# scrollback here is tmux's copy mode -- same as any other pane.
set -g mouse on
setw -g mode-keys vi
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
